# PingCode MCP 服务器配置文件
# 配置文件版本
version: "1.0.0"

# 服务器配置
server:
  name: "ping-code-mcp-server"
  version: "1.0.0"
  port: 8080
  host: "0.0.0.0"

# 日志配置
logging:
  level: "info"  # debug, info, warn, error, fatal
  format: "console"  # json, console
  output: "both"  # console, file, both

  # 文件日志配置
  file:
    path: "logs"
    filename: "PingCodeMcp.log"
    max_size: 100  # MB
    max_age: 7     # days
    max_backups: 10
    compress: true

  # 日志轮转配置
  rotation:
    enabled: true
    daily: true

# 环境变量覆盖配置
# 支持通过环境变量覆盖配置项
# 格式: PINGCODE_MCP_<SECTION>_<KEY>
# 例如: PINGCODE_MCP_SERVER_PORT=9090
env_override:
  enabled: true
  prefix: "PingCodeMcp"
